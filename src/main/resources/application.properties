spring.application.name=smart-home
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/smart_home
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MQTT
mqtt.broker-url=tcp://localhost:1884
mqtt.client-id=smart-home-backend
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.sensor-topic=data/sensor
mqtt.action-status-topic=action/status/+
mqtt.qos=1

user-id=1